<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14263f"/>
      <stop offset="1" stop-color="#0c1830"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="300" height="300" rx="64" fill="url(#bg)"/>

  <!-- back agent card -->
  <rect x="58" y="70" width="160" height="100" rx="18" fill="#ffffff" opacity="0.16"/>

  <!-- front agent card -->
  <rect x="76" y="102" width="160" height="100" rx="18" fill="#f8fafc"/>

  <!-- presence dot (available green) with soft ring -->
  <circle cx="106" cy="134" r="16" fill="#22c55e" opacity="0.25"/>
  <circle cx="106" cy="134" r="11" fill="#22c55e"/>

  <!-- name / status bars -->
  <rect x="126" y="126" width="88" height="16" rx="8" fill="#64748b"/>
  <rect x="95" y="160" width="102" height="14" rx="7" fill="#cbd5e1"/>

  <!-- dialpad badge (click-to-dial) -->
  <circle cx="212" cy="208" r="58" fill="#0c1830"/>
  <circle cx="212" cy="208" r="52" fill="url(#badge)"/>
  <g fill="#ffffff">
    <circle cx="187" cy="183" r="8"/><circle cx="212" cy="183" r="8"/><circle cx="237" cy="183" r="8"/>
    <circle cx="187" cy="208" r="8"/><circle cx="212" cy="208" r="8"/><circle cx="237" cy="208" r="8"/>
    <circle cx="187" cy="233" r="8"/><circle cx="212" cy="233" r="8"/><circle cx="237" cy="233" r="8"/>
  </g>
</svg>
